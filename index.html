document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:7px 14px;border-radius:8px;background:{{ todoFilterDoneBg }};color:{{ todoFilterDoneFg }};box-shadow:{{ todoFilterDoneSh }};\">Done · {{ todoDone }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:8px 20px;\">\n          <sc-for list=\"{{ todoRows }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--border);\">\n              <button onclick=\"{{ t.onToggle }}\" title=\"Toggle\" style=\"width:24px;height:24px;flex:none;border-radius:50%;border:2px solid {{ t.boxBorder }};background:{{ t.boxBg }};cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;\">\n                <svg width=\"13\" height=\"13\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"var(--on-accent)\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3.5 9.5l3.5 3.5 7.5-8\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n              <div style=\"flex:1;min-width:0;\">\n                <div style=\"font-size:14.5px;font-weight:600;color:{{ t.textColor }};text-decoration:{{ t.textDeco }};line-height:1.4;\">{{ t.text }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--muted);margin-top:3px;\">{{ t.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"background:color-mix(in srgb, {{ t.assigneeColor }} 16%, var(--surface));color:{{ t.assigneeColor }};padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;flex:none;\">{{ t.assignee }}<\u002Fspan>\n              <button onclick=\"{{ t.onDelete }}\" title=\"Delete\" style=\"border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:0 2px;flex:none;\">×<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ noTodosShown }} :999px;font-size:11.5px;font-weight:700;\">{{ r.category }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:16px;display:flex;flex-direction:column;gap:13px;flex:1;\">\n                <div style=\"font-weight:700;font-size:15px;line-height:1.35;\">{{ r.title }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:9px;margin-top:auto;\">\n                  <span style=\"width:24px;height:24px;flex:none;border-radius:7px;background:{{ r.filmedByColor }};color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:10px;\">{{ r.filmedByInitials }}<\u002Fspan>\n                  <div style=\"font-size:12px;color:var(--muted);min-width:0;\">Filmed by <span style=\"color:var(--fg);font-weight:600;\">{{ r.filmedBy }}<\u002Fspan> · {{ r.filmedFmt }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:8px;\">\n                  <sc-if value=\"{{ r.hasUrl }}\"><a href=\"{{ r.url }}\" target=\"_blank\" rel=\"noreferrer\" style=\"flex:1;text-align:center;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:9px;font-weight:700;font-size:13px;text-decoration:none;\">Watch on {{ r.linkType }} ↗<\u002Fa><\u002Fsc-if>\n                  <button onclick=\"{{ r.onEdit }}\" style=\"background:var(--surface-2);color:var(--fg);border:1px solid var(--border);border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer;font-size:13px;\">Edit<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ noResources }}\">\n          <div style=\"background:var(--surface);border:1px dashed var(--border);border-radius:16px;padding:54px 24px;text-align:center;\">\n            <div style=\"font-weight:700;font-size:16px;\">No videos here yet<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--muted);margin:6px 0 18px;\">Add the content you film for clients — Pinterest, Shopify or Backend.<\u002Fdiv>\n            <button onclick=\"{{ openResourceModal }}\" style=\"background:var(--accent);color:var(--on-accent);border:none;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:14px;\">+ Add a video<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ================= CLIENT PROGRESS ================= -->\n      <sc-if value=\"{{ isProgress }}\">\n      <div>\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;\">\n          <div style=\"font-weight:700;font-size:15px;margin-bottom:14px;\">Pipeline overview<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n            <sc-for list=\"{{ pipelineSummary }}\" as=\"p\" hint-placeholder-count=\"7\">\n              <div style=\"flex:1;min-width:110px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 13px;\">\n                <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:6px;\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ p.color }};flex:none;\"><\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.2;\">{{ p.label }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-family:'Space Grotesk';font-weight:700;font-size:24px;\">{{ p.count }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <sc-for list=\"{{ progressRows }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;\">\n              <div style=\"display:flex;align-items:center;gap:13px;flex-wrap:wrap;\">\n  [\n      {id:'t1',text:'Follow up with Aisha about her late payment',done:false,assignee:'Roan',createdBy:'Leo',createdAt:this.iso(2),completedBy:'',completedAt:''},\n      {id:'t2',text:'Record the onboarding walkthrough video for new clients',done:false,assignee:'Both',createdBy:'Roan',createdAt:this.iso(4),completedBy:'',completedAt:''},\n      {id:'t3',text:'Set up the recurring monthly revenue review call',done:true,assignee:'Leo',createdBy:'Leo',createdAt:this.iso(12),completedBy:'Leo',completedAt:this.iso(6)}\n    ];\n    const resources = [\n      {id:'r1',title:'Pinterest account setup walkthrough',url:'https://www.loom.com/share/example1',category:'Pinterest',filmedBy:'Leo',filmedAt:this.iso(20)},\n      {id:'r2',title:'Shopify product page optimization',url:'https://vimeo.com/example2',category:'Shopify',filmedBy:'Roan',filmedAt:this.iso(12)},\n      {id:'r3',title:'Backend automation & CRM handoff',url:'https://www.loom.com/share/example3',category:'Backend',filmedBy:'Leo',filmedAt:this.iso(6)},\n      {id:'r4',title:'Idea pin batching workflow',url:'https://www.loom.com/share/example4',category:'Pinterest',filmedBy:'Roan',filmedAt:this.iso(2)}\n    ];\n    const affiliates = [\n      {id:'a1',name:'Canva Pro',url:'https://canva.com/affiliate/example',code:'LEOROAN20',commission:'20% recurring',notes:'Great for client design onboarding. Pays monthly via PayPal.'},\n      {id:'a2',name:'Tailwind (Pinterest scheduler)',url:'https://tailwindapp.com/aff/example',code:'',commission:'$15 per signup',notes:'We recommend this in every Pinterest onboarding call.'},\n      {id:'a3',name:'Shopify Partner',url:'https://shopify.com/partners/example',code:'ROAN10',commission:'$150 per referral',notes:'One-time payout per store that goes live.'}\n    ];\n    return { screen:'overview', theme:(this.props.defaultTheme==='Dark'?'dark':'light'), heatFilter:'all', trendPeriod:'last7', todoFilter:'all', resourceFilter:'All',\n      goal:900000, weeklyGoal:5, clients, payments, posts, milestones, notes, todos, resources, affiliates,\n      accounts, currentUserId:null, authMode:'login', auth:{name:'',email:'',password:''}, authError:'',\n      modal:null, editingClientId:null, editingNoteId:null, editingResourceId:null, editingAffiliateId:null, copiedKey:'', paymentClientId:null, form:{}, vw:1200 };\n  }\n\n  migratePartner(x){ return (x==='Rowan'?'Roan':x); }\n\n  loadState(){\n    const base = this.defaultState();\n    let saved=null;\n    try{ saved=JSON.parse(localStorage.getItem(this.KEY)); }catch(e){}\n    if(saved && typeof saved==='object'){\n      if(Array.isArray(saved.posts)) saved.posts=saved.posts.map(p=>Object.assign({},p,{partner:this.migratePartner(p.partner)}));\n      if(Array.isArray(saved.payments)) saved.payments=saved.payments.map(p=>Object.assign({},p,{partner:this.migratePartner(p.partner)}));\n      if(!Array.isArray(saved.accounts)||!saved.accounts.length) saved.accounts=base.accounts;\n      const oldLbls=['First $100k','Quarter way','Halfway','Home stretch','The goal'];\n      if(Array.isArray(saved.milestones)) saved.milestones=saved.milestones.map(m=>oldLbls.indexOf(m.label)>=0?Object.assign({},m,{label:''}):m);\n      if(!Array.isArray(saved.notes)) saved.notes=base.notes;\n      if(!Array.isArray(saved.todos)) saved.todos=base.todos;\n      if(!Array.isArray(saved.resources)) saved.resources=base.resources;\n      if(Array.isArray(saved.clients)) saved.clients=saved.clients.map(c=>Object.assign({stageIndex:0},c));\n      if(!Array.isArray(saved.affiliates)) saved.affiliates=base.affiliates;\n      return Object.assign(base, saved, {authMode:'login', auth:{name:'',email:'',password:''}, authError:'', modal:null, editingClientId:null, editingNoteId:null, paymentClientId:null, form:{}, vw:(typeof window!=='undefined'?window.innerWidth:1200)});\n    }\n    return base;\n  }\n\n  currentUser(){ return this.state.accounts.find(a=>a.id===this.state.currentUserId)||null; }\n  currentName(){ const u=this.currentUser(); return u?u.name:'Leo'; }\n\n  componentDidMount(){ this._r=()=>this.setState({vw:window.innerWidth}); window.addEventListener('resize',this._r); this.setState({vw:window.innerWidth}); }\n  componentWillUnmount(){ window.removeEventListener('resize',this._r); }\n  componentDidUpdate(){ try{ const s=this.state; localStorage.setItem(this.KEY, JSON.stringify({screen:s.screen,theme:s.theme,heatFilter:s.heatFilter,trendPeriod:s.trendPeriod,todoFilter:s.todoFilter,goal:s.goal,weeklyGoal:s.weeklyGoal,clients:s.clients,payments:s.payments,posts:s.posts,milestones:s.milestones,notes:s.notes,todos:s.todos,resources:s.resources,affiliates:s.affiliates,accounts:s.accounts,currentUserId:s.currentUserId})); }catch(e){} }\n\n  // formatters\n  money=(n)=>'$'+Math.round(n||0).toLocaleString('en-US');\n  compact=(n)=>{ n=n||0; if(n>=1000000) return '$'+(n/1000000).toFixed(n%1000000?1:0)+'M'; if(n>=1000) return '$'+Math.round(n/1000)+'k'; return '$'+Math.round(n); };\n  fmtDate=(iso)=>{ if(!iso) return '—'; const a=iso.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]).toLocaleDateString('en-US',{month:'short',day:'numeric'}); };\n  rel=(iso)=>{ if(!iso) return ''; const a=iso.split('-').map(Number); const t=new Date(a[0],a[1]-1,a[2]); t.setHours(0,0,0,0); const now=new Date(); now.setHours(0,0,0,0); const d=Math.round((now-t)/86400000); if(d===0) return 'Today'; if(d===1) return 'Yesterday'; if(d>0) return d+'d ago'; if(d===-1) return 'Tomorrow'; return 'in '+(-d)+'d'; };\n  dueInfo=(iso)=>{ if(!iso) return {text:'—',color:'var(--muted)'}; const a=iso.split('-').map(Number); const t=new Date(a[0],a[1]-1,a[2]); t.setHours(0,0,0,0); const now=new Date(); now.setHours(0,0,0,0); const d=Math.round((t-now)/86400000); if(d<0) return {text:Math.abs(d)+'d overdue',color:'oklch(0.6 0.18 25)'}; if(d===0) return {text:'Due today',color:'oklch(0.62 0.16 60)'}; if(d<=7) return {text:'in '+d+'d',color:'oklch(0.62 0.16 60)'}; return {text:'in '+d+'d',color:'var(--muted)'}; };\n  initials=(n)=>(n||'?').trim().split(/\\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();\n  hashHue=(s)=>{ let h=0; for(let i=0;i<(s||'').length;i++) h=(h*31+s.charCodeAt(i))%360; return h; };\n  statusColor=(s)=> s==='At risk'?'oklch(0.62 0.17 55)': s==='Completed'?'var(--muted)': s==='Paused'?'oklch(0.58 0.04 260)':'var(--accent-strong)';\n\n  // handlers\n  setFormField=(k,v)=>this.setState(s=>({form:Object.assign({},s.form,{[k]:v})}));\n  field=(k)=>(e)=>this.setFormField(k,e.target.value);\n  go=(screen)=>this.setState({screen});\n  toggleTheme=()=>this.setState(s=>({theme:s.theme==='light'?'dark':'light'}));\n\n  authField=(k)=>(e)=>{ const v=e.target.value; this.setState(s=>({auth:Object.assign({},s.auth,{[k]:v}),authError:''})); };\n  setAuthMode=(m)=>this.setState({authMode:m,authError:'',auth:{name:'',email:'',password:''}});\n  doLogin=()=>{ const {email,password}=this.state.auth; const e=(email||'').trim().toLowerCase(); const acc=this.state.accounts.find(a=>a.email.toLowerCase()===e&&a.password===password); if(!acc){ this.setState({authError:'No account matches that email and password.'}); return; } this.setState({currentUserId:acc.id,auth:{name:'',email:'',password:''},authError:''}); };\n  doSignup=()=>{ const {name,email,password}=this.state.auth; const nm=(name||'').trim(); const e=(email||'').trim().toLowerCase(); if(!nm){ this.setState({authError:'Please enter your name.'}); return; } if(!e||!e.includes('@')){ this.setState({authError:'Please enter a valid email.'}); return; } if((password||'').length<4){ this.setState({authError:'Password must be at least 4 characters.'}); return; } if(this.state.accounts.some(a=>a.email.toLowerCase()===e)){ this.setState({authError:'An account with that email already exists.'}); return; } const acc={id:'u'+Date.now(),name:nm,email:e,password}; this.setState(s=>({accounts:s.accounts.concat([acc]),currentUserId:acc.id,auth:{name:'',email:'',password:''},authError:''})); };\n  submitAuth=()=>{ if(this.state.authMode=
